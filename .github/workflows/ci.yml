# SnakeXtreme continuous integration (issue #10; NFR-005, NFR-006, NFR-007).
#
# Every push to main and every pull request builds the project and runs the
# full CTest suite on Linux, macOS and Windows (MSVC and MinGW-w64). The job
# names below appear as status checks on each pull request; see
# docs/modes-build-ci.md for making them required before merging.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # SFML-free logic and tests only: proves the core builds and passes its
  # tests without SFML or a display (NFR-007, TC-TEST-01).
  headless:
    name: Tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-latest
            werror: "ON"
          - name: macOS Clang
            os: macos-latest
            werror: "ON"
          - name: Windows MSVC
            os: windows-latest
            werror: "OFF"
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -DSNAKE_BUILD_APP=OFF
          -DCMAKE_BUILD_TYPE=Release
          -DSNAKE_WARNINGS_AS_ERRORS=${{ matrix.werror }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Performance and acceptance tooling tests
        run: python -m unittest discover -s tests -p "test_*.py"

  mingw:
    name: Tests (Windows MinGW-w64)
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DSNAKE_BUILD_APP=OFF
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Every test under Clang AddressSanitizer + UndefinedBehaviorSanitizer
  # (issue #23; SEC-003, SEC-006). Any report fails the job.
  sanitizers:
    name: Sanitizers (Clang ASan + UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:strict_string_checks=1:detect_stack_use_after_return=1:check_initialization_order=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4

      - name: Install Clang and its sanitizer runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-rt-18-dev
          clang++ --version

      - name: Configure
        run: >
          cmake -S . -B build
          -DSNAKE_BUILD_APP=OFF
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++
          -DSNAKE_WARNINGS_AS_ERRORS=ON
          "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # cppcheck over src/, include/ and tests/ (issue #23, NFR-005). Any finding
  # fails the job; run the same check locally with cmake -P.
  cppcheck:
    name: Static analysis (cppcheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cppcheck

      - name: Run cppcheck
        run: cmake -P cmake/RunCppcheck.cmake

  # Full desktop build with the pinned SFML 2.5.1 (NFR-006). The Windows
  # executable is kept as a download for manual testing and demos.
  app:
    name: App build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows MSVC
            os: windows-latest
          - name: Linux GCC
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SFML build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxrandr-dev libudev-dev libgl1-mesa-dev libfreetype-dev \
            libopenal-dev libflac-dev libogg-dev libvorbis-dev xvfb xdotool

      - name: Configure
        run: >
          cmake -S . -B build
          -DSNAKE_FETCH_SFML=ON
          -DBUILD_SHARED_LIBS=OFF
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Audio backend smoke (null output, not audible acceptance)
        if: runner.os == 'Linux'
        env:
          ALSOFT_DRIVERS: 'null'
        run: ./build/audio_backend_smoke

      - name: Desktop navigation and Settings regression (Linux only)
        if: runner.os == 'Linux'
        run: |
          python tools/desktop_navigation_smoke.py "$PWD/build/SnakeXtreme"
          python tools/desktop_settings_smoke.py "$PWD/build/SnakeXtreme"
          python tools/desktop_leaderboard_smoke.py "$PWD/build/SnakeXtreme"

      - name: Upload Windows executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: SnakeXtreme-windows-x64
          path: |
            build/Release/SnakeXtreme.exe
            build/Release/openal32.dll
            build/Release/assets/
            build/Release/THIRD_PARTY_NOTICES.md
          if-no-files-found: error
          retention-days: 14
